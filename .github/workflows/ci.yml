name: ElectionTracker CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify source-derived Congress names
        run: |
          # This unittest compares the immutable pre-correction snapshot.
          git fetch --no-tags --depth=1 origin c343237594bde7a2e3bd837fceaaae6abad9a072
          python3 -m unittest discover -s tests -p 'test_congress_member_names.py' -v
      - name: Verify recorded browser wire recovery (15 controls)
        run: |
          node --test scripts/verify-browser-wire.node.mjs
          node scripts/audit-mixed-browser-wire.mjs
      - run: npm ci
      - run: npm test
      - name: Verify legacy Congress restore entrypoints refuse
        run: node --experimental-vm-modules --test tests/congress-legacy-guard.node.mjs
      - run: npm run check:type-mechanism
      - run: npm run test:e2e:list
      - run: npm run build
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Enforce full-project types
        shell: bash
        run: npm run check 2>&1 | tee typecheck.txt
      - name: Full dependency audit report
        if: always()
        run: npm audit --json > audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-reports
          path: |
            typecheck.txt
            audit.json
            artifacts/congress-legacy-guard-runs/
  bundle-budget:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-bundle.mjs
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: docker build --tag electiontracker:ci .
      - run: docker build --target builder --tag electiontracker:ci-builder .
      - name: Verify production image dependency boundary
        run: docker run --rm --entrypoint node electiontracker:ci -e "const fs=require('fs'); for (const p of ['node_modules/vite','node_modules/vitest','node_modules/@playwright/test','server','shared']) if(fs.existsSync(p)) throw Error('Unexpected runtime path '+p); if(!fs.existsSync('dist/index.js')) throw Error('Missing server bundle');"
      - name: Boot compiled app against isolated PostgreSQL
        env:
          TEST_IMAGE: electiontracker:ci
          TEST_BUILDER_IMAGE: electiontracker:ci-builder
          TEST_USER_FLOW: '1'
          TEST_BACKUP_RESTORE: '1'
          TEST_SHUTDOWN: '1'
          TEST_LISTING_CONTRACT: '1'
          TEST_ELECTION_TIMEZONE: '1'
          TEST_CANDIDATE_INGESTION: '1'
          TEST_POLL_HOURS: '1'
        run: node scripts/test-container.mjs
      - name: Verify Congress runtime packaging and receiving
        env:
          CONGRESS_PRODUCTION_IMAGE: electiontracker:ci
          CONGRESS_BUILDER_IMAGE: electiontracker:ci-builder
        run: node scripts/test-congress-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-receipt
          path: test-results/container
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: congress-production-receipt
          path: test-results/congress-production-*
